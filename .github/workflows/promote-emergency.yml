# EMERGENCY ONLY: skip UAT and move the current Beta straight to GA.
# The normal path is Beta -> UAT -> GA. Start this by hand from the
# Actions tab; it still needs Chuck's GA approval. UAT is updated too,
# so UAT never falls behind the main site.
name: EMERGENCY Beta -> GA (skips UAT, needs approval)
on:
  workflow_dispatch:
    inputs:
      reason: { description: "Why UAT is being skipped", required: true }
permissions:
  contents: write
  actions: write
concurrency:
  group: promote-ga
  cancel-in-progress: true
jobs:
  check:
    name: Check approvals are switched on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-approvals.sh
        env: { GH_TOKEN: "${{ github.token }}" }
  ga:
    name: "Approve Beta straight to GA: ${{ inputs.reason }}"
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: ga
      url: https://chuckedson541.github.io/
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Move current Beta to UAT and GA
        run: |
          git fetch origin beta
          sha=$(git rev-parse origin/beta)
          echo "Reason: ${{ inputs.reason }}"
          git push origin "$sha:refs/heads/uat" "$sha:refs/heads/main"
      - run: gh workflow run deploy.yml --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
